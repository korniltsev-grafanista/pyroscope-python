[package]
name = "remoteprocess"
version = "0.5.3"
authors = ["Ben Frederickson <github@benfrederickson.com>"]
repository = "https://github.com/benfred/remoteprocess"
homepage = "https://github.com/benfred/remoteprocess"
description = "cross platform api for getting information on a running processes"
readme = "README.md"
license = "MIT"
edition="2021"

[dependencies]
libc = "0.2"
log = "0.4"
proc-maps = "0.5"
read-process-memory = "0.2.0"
goblin = "0.10"
regex = ">=1.8.3"
cfg-if = "1.0.1"

[target.'cfg(target_os="macos")'.dependencies]
mach_o_sys = "0.1.1"
mach = "0.3.2"
libproc = "0.14"

[target.'cfg(target_os="linux")'.dependencies]
nix = {version = "0.31", default-features = false, features = ["ptrace", "sched", "signal"]}
object = "0.39"
addr2line = "0.26"
lazy_static = "1.5.0"
memmap2 = "0.9.10"

[target.'cfg(windows)'.dependencies]
winapi = {version = "0.3", features = ["winbase", "consoleapi", "wincon", "handleapi", "timeapi", "processenv", "errhandlingapi" ]}

[target.'cfg(all(any(target_os = "linux", target_os = "macos"), any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
kindasafe = { git = "https://github.com/grafana/pyroscope-kinda-safe", rev = "a2c5388ce896940424890519f5f9faab08394c83" }

[dev-dependencies]
env_logger = "0.11"

[target.'cfg(all(any(target_os = "linux", target_os = "macos"), any(target_arch = "x86_64", target_arch = "aarch64")))'.dev-dependencies]
kindasafe_init = { git = "https://github.com/grafana/pyroscope-kinda-safe", rev = "a2c5388ce896940424890519f5f9faab08394c83" }

[target.'cfg(target_os="freebsd")'.dev-dependencies]
mark-flaky-tests = "1"

[features]
default = []
counters = []
