[features]
default = []
counters = ["remoteprocess/counters"]

[package]
name = "py-spy"
version = "0.4.2"
authors = ["Ben Frederickson <github@benfrederickson.com>"]
repository = "https://github.com/benfred/py-spy"
homepage = "https://github.com/benfred/py-spy"
description = "Sampling profiler for Python programs "
readme = "README.md"
exclude = ["images/*", "test_programs/*"]
license = "MIT"
build = "build.rs"
edition = "2021"
rust-version = "1.98"

[dependencies]
anyhow = "1"
goblin = "0.10.5"
lazy_static = "1.4.0"
libc = "0.2"
log = "0.4"
lru = "0.17"
num-traits = "0.2"
regex = ">=1.6.0"
page_size = "0.6.0"
proc-maps = "0.4.0"
memmap2 = "0.9.4"
serde = { version = "1.0", features = ["rc"] }
serde_derive = "1.0"
rand = "0.9"
rand_distr = "0.5"
remoteprocess = { path = "../remoteprocess" }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["errhandlingapi", "winbase", "consoleapi", "wincon", "handleapi", "timeapi", "processenv"] }
